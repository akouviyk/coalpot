<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>De' Coal Pot | Authentic Caribbean Restaurant — Cruz Bay, St. John USVI</title>
  <script>
    // GitHub Pages SPA redirect hack — preserves URL for React Router
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">De' Coal Pot Restaurant</a>...</p>
</body>
</html>
